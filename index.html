<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Thảo - By Tùng Tồi Tệ</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #2c1635, #0f0715);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng các ngôi sao lấp lánh nền */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Khung hiển thị chính */
        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            z-index: 2;
        }

        /* Khung chứa ảnh nghệ thuật (Thay thế hoàn toàn cho cái cây) */
        .photo-frame-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatPhoto 3s ease-in-out infinite alternate;
        }

        @keyframes floatPhoto {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff758c;
            box-shadow: 0 0 20px rgba(255, 117, 140, 0.6), 0 0 40px rgba(255, 117, 140, 0.3);
        }

        /* Hiệu ứng vòng sáng trang trí quanh ảnh */
        .glow-ring {
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 182, 193, 0.5);
            animation: rotateRing 15s linear infinite;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Hộp chứa chữ lời chúc kiểu thanh lịch */
        .message-box {
            width: 100%;
            text-align: center;
            font-size: 14.5px;
            color: #ffe6eb;
            line-height: 1.6;
            min-height: 130px;
            white-space: pre-wrap;
            font-weight: 400;
            text-shadow: 0 0 8px rgba(255, 107, 129, 0.4);
            padding: 0 10px;
        }

        /* Đồng hồ đếm ngược */
        .countdown-box {
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #ffb3c6;
            font-weight: bold;
            padding: 10px 15px;
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        #timer {
            margin-top: 4px;
            font-size: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Nút bật/tắt nhạc góc phải */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <button class="music-btn" id="musicToggle" onclick="toggleMusic()">🎵 Bật/Tắt Nhạc</button>

    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <div class="photo-frame-container">
            <div class="glow-ring"></div>
            <img src="image_72a79d.png" alt="Thảo" class="photo-frame">
        </div>

        <div class="message-box" id="textMessage"></div>

        <div class="countdown-box">
            <div>✨ Đếm ngược đến sinh nhật Thảo (04/08) ✨</div>
            <div id="timer"></div>
        </div>
    </div>

    <script>
        // 1. Tạo hiệu ứng bầu trời đầy sao động
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 1) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(star);
        }

        // 2. Giữ nguyên 100% lời chúc của bạn
        const rawContent = `Chúc Mừng Sinh Nhật Thảo, 

Tùng chúc Thảo sinh nhật tuổi mới thật là vui vẻ, chúc cậu tuổi mới gặp nhiều may mắn, thuận lợi thi đỗ 2 kì thi sắp tới nhé. 

— Ký tên: Tùng Tồi Tệ haha —`;

        let index = 0;
        const speed = 45;
        const textMessage = document.getElementById('textMessage');

        function typeWriter() {
            if (index < rawContent.length) {
                textMessage.innerHTML = rawContent.substring(0, index + 1);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                // Khi gõ xong chữ thì bắn pháo hoa ăn mừng
                triggerFireworks();
            }
        }

        // Bắt đầu chạy chữ sau 1 giây mở trang
        setTimeout(typeWriter, 1000);

        // 3. Hiệu ứng pháo hoa rực rỡ
        function triggerFireworks() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0, y: 0.7 },
                    colors: ['#ff758c', '#ff7eb3', '#ffffff']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1, y: 0.7 },
                    colors: ['#ff758c', '#ff7eb3', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // 4. Đồng hồ đếm ngược đến 04/08
        function updateCountdown() {
            const now = new Date();
            let currentYear = now.getFullYear();
            let targetDate = new Date(currentYear, 7, 4, 0, 0, 0); // Tháng 7 là tháng 8
            
            if (now > targetDate) {
                targetDate = new Date(currentYear + 1, 7, 4, 0, 0, 0);
            }

            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('timer').innerHTML = 
                    `${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;
            } else {
                document.getElementById('timer').innerHTML = "¡Feliz Cumpleaños Thảo! 🎉🎂";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 5. Xử lý âm thanh nhạc nền
        const music = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                document.getElementById('musicToggle').innerText = "🎵 Bật Nhạc";
            } else {
                music.play().then(() => {
                    isPlaying = true;
                    document.getElementById('musicToggle').innerText = "🔇 Tắt Nhạc";
                }).catch(e => {});
            }
        }

        window.addEventListener('click', () => {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    document.getElementById('musicToggle').innerText = "🔇 Tắt Nhạc";
                }).catch(e => {});
            }
        }, { once: true });
    </script>
</body>
</html>
