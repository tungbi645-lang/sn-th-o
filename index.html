<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Thảo - By Tùng Tồi Tệ</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #2c1635, #0f0715);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Sao lấp lánh nền */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* MÀN HÌNH 1: CHIẾC THIỆP BAN ĐẦU */
        .card-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(15, 7, 21, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .envelope {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            width: 280px;
            height: 180px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.5);
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
            animation: floatEnvelope 2s ease-in-out infinite alternate;
        }

        .envelope:hover {
            transform: scale(1.05);
        }

        @keyframes floatEnvelope {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .envelope-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .open-btn {
            margin-top: 25px;
            background: #ffffff;
            color: #ff4d6d;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.4);
            transition: 0.3s;
        }

        .open-btn:hover {
            background: #ffe6eb;
            transform: scale(1.08);
        }

        /* MÀN HÌNH CHÍNH (Sau khi bấm mở thiệp) */
        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            z-index: 2;
            opacity: 0;
            transform: scale(0.9);
            transition: all 1s ease;
            pointer-events: none;
        }

        .main-wrapper.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Khung ảnh */
        .photo-frame-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatPhoto 3s ease-in-out infinite alternate;
        }

        @keyframes floatPhoto {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }

        .photo-frame {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff758c;
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.7);
        }

        .glow-ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 182, 193, 0.6);
            animation: rotateRing 15s linear infinite;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Hộp lời chúc */
        .message-box {
            width: 100%;
            text-align: center;
            font-size: 14.5px;
            color: #ffe6eb;
            line-height: 1.6;
            min-height: 130px;
            white-space: pre-wrap;
            font-weight: 400;
            text-shadow: 0 0 8px rgba(255, 107, 129, 0.4);
            padding: 0 10px;
        }

        /* Đồng hồ đếm ngược */
        .countdown-box {
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #ffb3c6;
            font-weight: bold;
            padding: 10px 15px;
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        #timer {
            margin-top: 4px;
            font-size: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="canon.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>

    <div class="card-overlay" id="cardOverlay">
        <div class="envelope" onclick="openCard()">
            <span style="font-size: 50px;">💌</span>
            <div class="envelope-text">Gửi Thảo Nhé!</div>
        </div>
        <button class="open-btn" onclick="openCard()">✨ Mở Thiệp & Nghe Nhạc ✨</button>
    </div>

    <div class="main-wrapper" id="mainWrapper">
        <div class="photo-frame-container">
            <div class="glow-ring"></div>
            <img src="image_729497.png" alt="Thảo" class="photo-frame">
        </div>

        <div class="message-box" id="textMessage"></div>

        <div class="countdown-box">
            <div>✨ Đếm ngược đến sinh nhật Thảo (04/08) ✨</div>
            <div id="timer"></div>
        </div>
    </div>

    <script>
        // 1. Tạo sao lấp lánh nền
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 1) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(star);
        }

        // 2. Hành động khi bấm mở thiệp (Phát nhạc Canon D + Hiệu ứng)
        function openCard() {
            const music = document.getElementById('bgMusic');
            music.play().then(() => {
                console.log("Nhạc Canon D đang phát!");
            }).catch(error => {
                console.log("Lỗi phát nhạc:", error);
            });

            // Ẩn màn hình thiệp đi
            const overlay = document.getElementById('cardOverlay');
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';

            // Hiển thị màn hình chính
            const mainWrapper = document.getElementById('mainWrapper');
            mainWrapper.classList.add('show');

            // Bắn pháo hoa tưng bừng
            launchMassiveFireworks();

            // Chạy chữ lời chúc
            setTimeout(typeWriter, 500);
        }

        // 3. Pháo hoa liên tục
        function launchMassiveFireworks() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#ff758c', '#ff7eb3', '#ffffff', '#ffd1dc']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ff758c', '#ff7eb3', '#ffffff', '#ffd1dc']
                }));
            }, 250);
        }

        // 4. Lời chúc của bạn
        const rawContent = `Chúc Mừng Sinh Nhật Thảo, 

Tùng chúc Thảo sinh nhật tuổi mới thật là vui vẻ, chúc cậu tuổi mới gặp nhiều may mắn, thuận lợi thi đỗ 2 kì thi sắp tới nhé. 

— Ký tên: Tùng Tồi Tệ haha —`;

        let index = 0;
        const speed = 40;
        const textMessage = document.getElementById('textMessage');

        function typeWriter() {
            if (index < rawContent.length) {
                textMessage.innerHTML = rawContent.substring(0, index + 1);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff758c', '#ff7eb3', '#ffffff']
                });
            }
        }

        // 5. Đồng hồ đếm ngược đến 04/08
        function updateCountdown() {
            const now = new Date();
            let currentYear = now.getFullYear();
            let targetDate = new Date(currentYear, 7, 4, 0, 0, 0); // Tháng 7 là tháng 8
            
            if (now > targetDate) {
                targetDate = new Date(currentYear + 1, 7, 4, 0, 0, 0);
            }

            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('timer').innerHTML = 
                    `${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;
            } else {
                document.getElementById('timer').innerHTML = "¡Feliz Cumpleaños Thảo! 🎉🎂";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
