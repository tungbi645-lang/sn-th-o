<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Thảo - By Tùng Tồi Tệ</title>
    <!-- Thư viện hiệu ứng pháo hoa/pháo giấy -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Nền bầu trời đêm lãng mạn */
            background: radial-gradient(circle at bottom, #1b1b3a, #0b0b1a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng các ngôi sao lấp lánh trên bầu trời */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Khung hiển thị chính */
        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 2;
        }

        /* Khu vực Cây Tình Yêu */
        .tree-container {
            position: absolute;
            bottom: 170px;
            display: flex;
            justify-content: center;
            width: 200px;
            height: 200px;
        }

        /* Thân cây gỗ sáng màu nổi bật trên nền tối */
        .trunk {
            width: 12px;
            height: 0px;
            background: linear-gradient(to top, #4a3525, #8B4513);
            position: absolute;
            bottom: 0;
            border-radius: 6px;
            animation: growTrunk 2s ease-out forwards;
            box-shadow: 0 0 10px rgba(139, 69, 19, 0.5);
        }

        @keyframes growTrunk {
            to { height: 170px; }
        }

        /* Tán lá hình trái tim phát sáng */
        .heart-canopy {
            position: absolute;
            top: -40px;
            width: 200px;
            height: 200px;
            opacity: 0;
            transform: scale(0);
            animation: bloomCanopy 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2s forwards;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        @keyframes bloomCanopy {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .heart-leaf {
            color: #ff3366;
            font-size: 22px;
            line-height: 1;
            margin: -2px;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.8);
            animation: heartbeat 1.2s infinite alternate;
        }

        @keyframes heartbeat {
            from { transform: scale(1); }
            to { transform: scale(1.2); filter: brightness(1.3); }
        }

        /* Hộp chứa chữ lời chúc kiểu neon nhẹ */
        .message-box {
            position: absolute;
            bottom: 65px;
            width: 100%;
            text-align: center;
            font-size: 14.5px;
            color: #ffccd5;
            line-height: 1.6;
            min-height: 110px;
            white-space: pre-wrap;
            padding: 0 15px;
            font-weight: 500;
            text-shadow: 0 0 5px rgba(255, 107, 129, 0.5);
        }

        /* Đồng hồ đếm ngược */
        .countdown-box {
            position: absolute;
            bottom: 10px;
            width: 90%;
            text-align: center;
            font-size: 13px;
            color: #ffb3c6;
            font-weight: bold;
            padding: 8px 12px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #timer {
            margin-top: 3px;
            font-size: 15px;
            color: #ffffff;
        }

        /* Nút bật/tắt nhạc dự phòng nếu trình duyệt chặn autoplay */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Nút bật/tắt nhạc -->
    <button class="music-btn" id="musicToggle" onclick="toggleMusic()">🎵 Bật/Tắt Nhạc</button>

    <!-- Nhạc nền Lofi lãng mạn (Sử dụng nguồn nhạc trực tuyến không bản quyền) -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper" id="mainWrapper">
        <!-- Cây tình yêu -->
        <div class="tree-container">
            <div class="trunk"></div>
            <div class="heart-canopy" id="heartCanopy"></div>
        </div>

        <!-- Lời chúc -->
        <div class="message-box" id="textMessage"></div>

        <!-- Đếm ngược -->
        <div class="countdown-box">
            <div>✨ Đếm ngược đến sinh nhật Thảo (04/08) ✨</div>
            <div id="timer"></div>
        </div>
    </div>

    <script>
        // 1. Tạo hiệu ứng bầu trời đầy sao động
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 1) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(star);
        }

        // 2. Tạo tán lá trái tim
        const canopy = document.getElementById('heartCanopy');
        const heartRows = [6, 9, 10, 9, 7, 4]; 

        heartRows.forEach(count => {
            const rowDiv = document.createElement('div');
            rowDiv.style.display = 'flex';
            rowDiv.style.width = '100%';
            rowDiv.style.justifyContent = 'center';
            rowDiv.style.margin = '-2px 0';
            
            for (let i = 0; i < count; i++) {
                const span = document.createElement('span');
                span.className = 'heart-leaf';
                span.innerHTML = '❤️';
                rowDiv.appendChild(span);
            }
            canopy.appendChild(rowDiv);
        });

        // 3. Giữ nguyên lời chúc của bạn theo yêu cầu
        const rawContent = `Chúc Mừng Sinh Nhật Thảo, 

Tùng chúc Thảo sinh nhật tuổi mới thật là vui vẻ, chúc cậu tuổi mới gặp nhiều may mắn, thuận lợi thi đỗ 2 kì thi sắp tới nhé. 

— Ký tên: Tùng Tồi Tệ haha —`;

        let index = 0;
        const speed = 45;
        const textMessage = document.getElementById('textMessage');

        function typeWriter() {
            if (index < rawContent.length) {
                textMessage.innerHTML = rawContent.substring(0, index + 1);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                // Khi gõ xong chữ thì bắn pháo hoa ăn mừng
                triggerFireworks();
            }
        }

        // Bắt đầu chạy chữ sau khi cây mọc xong (3.5s)
        setTimeout(typeWriter, 3500);

        // 4. Hiệu ứng pháo hoa rực rỡ
        function triggerFireworks() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0, y: 0.7 },
                    colors: ['#ff3366', '#ff6b81', '#ffa3af']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1, y: 0.7 },
                    colors: ['#ff3366', '#ff6b81', '#ffa3af']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // 5. Đồng hồ đếm ngược đến 04/08
        function updateCountdown() {
            const now = new Date();
            let currentYear = now.getFullYear();
            let targetDate = new Date(currentYear, 7, 4, 0, 0, 0); 
            
            if (now > targetDate) {
                targetDate = new Date(currentYear + 1, 7, 4, 0, 0, 0);
            }

            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('timer').innerHTML = 
                    `${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;
            } else {
                document.getElementById('timer').innerHTML = "¡Feliz Cumpleaños Thảo! 🎉🎂";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 6. Xử lý âm thanh tự động phát hoặc bấm nút
        const music = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                document.getElementById('musicToggle').innerText = "🎵 Bật Nhạc";
            } else {
                music.play().then(() => {
                    isPlaying = true;
                    document.getElementById('musicToggle').innerText = "🔇 Tắt Nhạc";
                }).catch(e => {
                    console.log("Trình duyệt chặn autoplay");
                });
            }
        }

        // Tự động thử phát nhạc khi người dùng tương tác lần đầu với trang web
        window.addEventListener('click', () => {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    document.getElementById('musicToggle').innerText = "🔇 Tắt Nhạc";
                }).catch(e => {});
            }
        }, { once: true });
    </script>
</body>
</html>
